[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-cleaning-pipeline"
version = "1.0.0"
description = "Data cleaning pipeline generator for pandas, polars, and PySpark"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Data Science Accelerator" },
]
keywords = ["data-cleaning", "pandas", "polars", "pyspark", "data-science"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
polars = ["polars>=0.18.0"]
spark = ["pyspark>=3.0.0"]
dev = [
    "pytest>=7.0.0",
    "polars>=0.18.0",
]

[project.urls]
Homepage = "https://github.com/jameslam/data-cleaning-pipeline"
Repository = "https://github.com/jameslam/data-cleaning-pipeline"

[tool.setuptools.packages.find]
where = ["."]
include = ["data_cleaning_pipeline*"]
exclude = ["tests*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]